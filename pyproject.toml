[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "deco-graph"
version = "0.1.0"
description = "Expander decomposition, congestion approximator and normalized cut for large graphs, on the CPU or with CUDA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
scipy = ["scipy"]
test = ["pytest", "scipy>=1.15"]   # 1.15: mmread(spmatrix=False)

[project.urls]
Repository = "https://github.com/RobinMnk/deco"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["python/deco"]
# the Python module and the command-line tool (installed onto the PATH), not the C++ tests
cmake.define = { DECO_BUILD_PYTHON = "ON", DECO_BUILD_TESTS = "OFF" }

[tool.pytest.ini_options]
testpaths = ["python/tests"]
