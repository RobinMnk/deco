name: Tests

on:
  push:
    branches: [master]
  workflow_dispatch:   # allows starting the workflow by hand from the Actions tab

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # All CPU tests on Linux (GCC) and Windows (MSVC), in Debug (assertions active) and Release (optimized code).
  cpu:
    name: CPU tests (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DDECO_ENABLE_CUDA=OFF

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  # CPU tests with AddressSanitizer and UndefinedBehaviorSanitizer: dangling pointers, out-of-bounds accesses and
  # undefined behavior fail immediately with a precise report instead of working by luck.
  sanitizers:
    name: CPU tests (sanitizers)
    runs-on: ubuntu-latest
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DDECO_ENABLE_CUDA=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Builds everything with CUDA enabled (CUDA code, CLI and CudaTest). GitHub-hosted runners have no GPU,
  # so this checks that the CUDA code compiles and links, and runs the tests: the ones that need a GPU skip themselves.
  # Only the needed CUDA components are installed (compiler, runtime, Thrust/CUB): the full CUDA container image
  # does not fit on the runner's disk.
  cuda-build:
    name: CUDA build
    # pinned: nvcc 12.9 supports GCC up to 14 as host compiler (Ubuntu 24.04 ships GCC 13), and the NVIDIA apt
    # repository below is the one for Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA compiler and runtime
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cuda-nvcc-12-9 cuda-cudart-dev-12-9 cuda-cccl-12-9
          echo "/usr/local/cuda-12.9/bin" >> "$GITHUB_PATH"
          g++ --version | head -1

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DDECO_ENABLE_CUDA=ON -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.9/bin/nvcc

      - name: Build
        run: cmake --build build --parallel

      - name: Test (the GPU tests are skipped)
        run: ctest --test-dir build --output-on-failure

  # All tests including CudaTest, in Release (as the GPU code is used), on a machine with an NVIDIA GPU and the
  # CUDA toolkit. Needs a self-hosted runner with the labels "self-hosted", "linux" and "gpu", and only runs if the
  # repository variable GPU_RUNNER is set to "true" (Settings > Secrets and variables > Actions > Variables).
  cuda-tests:
    name: CUDA tests
    if: ${{ vars.GPU_RUNNER == 'true' }}
    runs-on: [self-hosted, linux, gpu]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDECO_ENABLE_CUDA=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
