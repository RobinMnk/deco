name: CUDA tests (simulated H100)

# Optional check. The hosted runners have no GPU, so the cuda-build job skips
# CudaTest. This job builds with CUDA enabled and runs all tests, including
# CudaTest and the CUDA cases of decoTest, on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator does not reproduce
# real hardware or timing, so this complements real-GPU testing.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/**"
      - "tests/**"
      - "cli/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: gpu-sim-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cuda-sim:
    name: CUDA 13.0, simulated H100
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@deff5781e8adfd83dec98dd5242dcbc96a564773 # v0.1.10
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      # The simulator runs PTX, so the CUDA library is built for 90-virtual
      # instead of its fixed "80;86", and it needs a shared CUDA runtime.
      - name: Configure
        run: |
          sed -i 's/CUDA_ARCHITECTURES "80;86"/CUDA_ARCHITECTURES "90-virtual"/' \
            lib/algorithms/expander_decomposition/cuda/internal/CMakeLists.txt
          grep -q 'CUDA_ARCHITECTURES "90-virtual"' \
            lib/algorithms/expander_decomposition/cuda/internal/CMakeLists.txt
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DDECO_ENABLE_CUDA=ON \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared

      - name: Build
        run: vgpu run --preload cmake --build build -j3

      # Without a device the CUDA tests call GTEST_SKIP, so a skipped test, a
      # simulator error or a missing kernel launch fails the job.
      - name: Test
        run: |
          set -o pipefail
          vgpu run --counters ctest --test-dir build --no-tests=error \
            --output-on-failure -V 2>&1 | tee ctest.log
          grep -q '100% tests passed' ctest.log
          if grep -Ei 'VirtualGPU error|no CUDA device|\[  SKIPPED|\*\*\*Skipped|Not Run|\[  FAILED' ctest.log; then
            echo "::error::simulator error, missing device, skipped or failed test"; exit 1
          fi
          grep -q 'Test command: .*CudaTest' ctest.log
          for k in fusedRandomWalk_WarpParallel nodeDiffKernel_Sparse_WarpParallel disableEdgesKernel_node linkEdges_kernel_nodeView; do
            n=$(grep -F '[vgpu][counters]' ctest.log | grep -Fc "$k" || true)
            echo "$k: $n launches"
            [ "$n" -gt 0 ] || { echo "::error::no launch of $k"; exit 1; }
          done
          echo "$(grep -cE 'Test +#[0-9]+: .*Passed' ctest.log) tests passed"
